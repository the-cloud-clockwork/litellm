name: Anton — build & push litellm image to GHCR

# Manual build of the Anton fleet's litellm image from this branch's code.
# v1.93.0 dropped the old ghcr_deploy.yml; this is a minimal, self-contained
# replacement that builds the root Dockerfile and pushes to the fork's GHCR.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to push (e.g. anton-latest, anton-rc)"
        required: true
        default: anton-rc

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ghcr.io/the-cloud-clockwork/litellm:${{ github.event.inputs.tag }}
          provenance: false
